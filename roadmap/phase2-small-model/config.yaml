# Music Transformer 학습 설정

model:
  vocab_size: 391
  d_model: 256
  num_layers: 4
  num_heads: 8
  d_ff: 1024
  max_seq_len: 512
  dropout: 0.1

training:
  batch_size: 16
  epochs: 10
  learning_rate: 0.0001
  warmup_steps: 1000
  gradient_clip: 1.0
  weight_decay: 0.01

  # 체크포인트
  save_every: 1000  # 1000 스텝마다 저장
  eval_every: 500   # 500 스텝마다 평가
  checkpoint_dir: checkpoints

data:
  train_path: ../phase1-setup/data/processed/train.pkl
  val_path: ../phase1-setup/data/processed/val.pkl
  test_path: ../phase1-setup/data/processed/test.pkl

device: cuda  # cuda or cpu
seed: 42

# WandB logging (선택)
wandb:
  enabled: false
  project: charlie-parker-ai
  name: small-transformer-v1
